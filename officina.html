<!doctype html>
<html lang="it">
  <head>
    <script>
      if (location.protocol === 'http:' && location.hostname !== 'localhost') {
        location.replace('https://' + location.host + location.pathname + location.search + location.hash);
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#171d23" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Capofficina" />
    <meta name="description" content="Situazione verniciature e lavorazioni del capofficina SIMPRO Lamiere" />
    <link rel="icon" href="https://www.simprolamiere.it/wp-content/uploads/2024/07/logo-simpro-128x128.png" />
    <link rel="apple-touch-icon" href="https://www.simprolamiere.it/wp-content/uploads/2024/07/logo-simpro-128x128.png" />
    <title>SIMPRO · Capofficina</title>
    <style>
      #office-diagnostic { display:none; margin:20px; padding:18px; border-radius:14px; background:#fff3f3; color:#8b0000; font-family:Arial,sans-serif; white-space:pre-wrap; overflow-wrap:anywhere; }
      .office-kpis > div, .office-painters > div { cursor:pointer; user-select:none; }
      .office-kpis > div::after, .office-painters > div::after { content:"Apri ›"; display:block; margin-top:6px; font-size:12px; font-weight:800; opacity:.65; }
      .office-kpis > div:active, .office-painters > div:active { transform:scale(.98); }
      .office-list-overlay { position:fixed; inset:0; z-index:99999; overflow:auto; background:#f4f6f8; padding:18px; }
      .office-list-inner { max-width:1100px; margin:0 auto; }
      .office-list-head { position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:14px; padding:10px 0 18px; background:#f4f6f8; }
      .office-list-head h1 { margin:0; font-size:clamp(24px,5vw,34px); }
      .office-list-back { border:0; border-radius:14px; padding:13px 17px; background:#171d23; color:#fff; font-size:16px; font-weight:800; }
      .office-list-grid { display:grid; gap:14px; }
      .office-list-empty { padding:28px; border-radius:18px; background:#fff; text-align:center; font-weight:700; }
      body.office-list-open { overflow:hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <pre id="office-diagnostic"></pre>
    <script>
      const showOfficeError = (message) => {
        const box = document.getElementById('office-diagnostic');
        if (!box) return;
        box.style.display = 'block';
        box.textContent = 'ERRORE CARICAMENTO\n\n' + String(message || 'Errore sconosciuto');
      };
      window.addEventListener('error', (event) => showOfficeError(event.error?.stack || event.message));
      window.addEventListener('unhandledrejection', (event) => showOfficeError(event.reason?.stack || event.reason?.message || event.reason));
      setTimeout(() => {
        const root = document.getElementById('root');
        if (root && root.textContent.includes('Caricamento situazione verniciature')) {
          showOfficeError('La richiesta dati non ha risposto entro 12 secondi. Possibile problema nella funzione Supabase get_officina_board o nella connessione al database.');
        }
      }, 12000);

      const allCards = (selector) => [...document.querySelectorAll(selector)];
      const deliveredToPainterCards = () => allCards('.office-section.delivered .office-card .status-consegnato').map((status) => status.closest('.office-card'));
      const returningFromPainterCards = () => allCards('.office-section.to-collect .office-card');
      const toPainterCards = () => allCards('.office-section.to-take .office-card');
      const cardsForCategory = (index) => index === 0 ? toPainterCards() : index === 1 ? returningFromPainterCards() : deliveredToPainterCards();
      const categoryTitles = ['Da portare', 'Dal verniciatore', 'Da ritirare'];

      function openOfficeList(title, cards) {
        document.querySelector('.office-list-overlay')?.remove();
        const overlay = document.createElement('div');
        overlay.className = 'office-list-overlay';
        overlay.innerHTML = `<div class="office-list-inner"><div class="office-list-head"><button class="office-list-back" type="button">← Indietro</button><h1>${title}</h1></div><div class="office-list-grid"></div></div>`;
        const grid = overlay.querySelector('.office-list-grid');
        if (cards.length) cards.forEach((card) => grid.appendChild(card.cloneNode(true)));
        else grid.innerHTML = '<div class="office-list-empty">Nessun cliente presente.</div>';
        document.body.appendChild(overlay);
        document.body.classList.add('office-list-open');
        overlay.querySelector('.office-list-back').onclick = () => {
          overlay.remove();
          document.body.classList.remove('office-list-open');
        };
      }

      function syncAdminMirror() {
        const kpis = [...document.querySelectorAll('.office-kpis > div')];
        kpis.forEach((kpi, index) => {
          const counter = kpi.querySelector('strong');
          const next = String(cardsForCategory(index).length);
          if (counter && counter.textContent !== next) counter.textContent = next;
        });

        const pickupCards = deliveredToPainterCards();
        document.querySelectorAll('.office-painters > div').forEach((row) => {
          const painter = row.querySelector('span')?.textContent?.trim().toUpperCase();
          const count = pickupCards.filter((card) => String(card.textContent || '').toUpperCase().includes(painter)).length;
          const counter = row.querySelector('strong');
          if (counter && counter.textContent !== String(count)) counter.textContent = String(count);
          row.setAttribute('role', 'button');
          row.setAttribute('tabindex', '0');
        });
      }

      document.addEventListener('click', (event) => {
        const kpi = event.target.closest('.office-kpis > div');
        if (kpi) {
          const kpis = [...document.querySelectorAll('.office-kpis > div')];
          const index = kpis.indexOf(kpi);
          openOfficeList(categoryTitles[index], cardsForCategory(index));
          return;
        }

        const painterRow = event.target.closest('.office-painters > div');
        if (painterRow) {
          const painter = painterRow.querySelector('span')?.textContent?.trim().toUpperCase();
          const cards = deliveredToPainterCards().filter((card) => String(card.textContent || '').toUpperCase().includes(painter));
          openOfficeList(`Da ritirare · ${painter}`, cards);
        }
      });

      const mirrorObserver = new MutationObserver(() => requestAnimationFrame(syncAdminMirror));
      mirrorObserver.observe(document.getElementById('root'), { childList:true, subtree:true });
      setInterval(syncAdminMirror, 1000);
    </script>
    <script type="module" src="/src/officina.js"></script>
    <script type="module" src="/src/officina-dedupe.js"></script>
  </body>
</html>
