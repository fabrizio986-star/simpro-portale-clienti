<!doctype html>
<html lang="it">
  <head>
    <script>
      if (location.protocol === 'http:' && location.hostname !== 'localhost') {
        location.replace('https://' + location.host + location.pathname + location.search + location.hash);
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#171d23" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Capofficina" />
    <meta name="description" content="Situazione verniciature e lavorazioni del capofficina SIMPRO Lamiere" />
    <link rel="icon" href="https://www.simprolamiere.it/wp-content/uploads/2024/07/logo-simpro-128x128.png" />
    <link rel="apple-touch-icon" href="https://www.simprolamiere.it/wp-content/uploads/2024/07/logo-simpro-128x128.png" />
    <title>SIMPRO · Capofficina</title>
    <style>
      .office-kpis > div, .office-painters > div { cursor: pointer; position: relative; transition: transform .15s ease, box-shadow .15s ease; user-select: none; }
      .office-kpis > div::after, .office-painters > div::after { content: "Apri ›"; margin-left: auto; font-size: 12px; font-weight: 800; opacity: .7; }
      .office-kpis > div:active, .office-painters > div:active { transform: scale(.98); }
      .office-task-screen { position: fixed; inset: 0; z-index: 9999; overflow-y: auto; background: #f4f6f8; padding: max(env(safe-area-inset-top), 12px) 18px 32px; }
      .office-task-bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 14px; padding: 10px 0 18px; background: #f4f6f8; }
      .office-task-back { border: 0; border-radius: 14px; padding: 13px 17px; background: #171d23; color: white; font-size: 16px; font-weight: 800; cursor: pointer; }
      .office-task-bar h1 { margin: 0; font-size: clamp(23px, 5vw, 34px); }
      .office-task-content { max-width: 1100px; margin: 0 auto; }
      .office-task-content .office-grid { display: grid; gap: 14px; }
      .office-task-empty { background: white; border-radius: 18px; padding: 30px; text-align: center; font-weight: 700; }
      body.office-task-open { overflow: hidden; }
      @media (hover:hover) {
        .office-kpis > div:hover, .office-painters > div:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(23,29,35,.12); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/officina.js"></script>
    <script>
      (() => {
        const categoryConfig = [
          { selector: '.office-section.to-take', title: 'Da portare' },
          { selector: '.office-section.delivered', title: 'Dal verniciatore' },
          { selector: '.office-section.to-collect', title: 'Da ritirare' }
        ];

        function openScreen(title, cards) {
          document.querySelector('.office-task-screen')?.remove();
          const screen = document.createElement('div');
          screen.className = 'office-task-screen';
          const content = document.createElement('div');
          content.className = 'office-task-content';
          content.innerHTML = `<div class="office-task-bar"><button class="office-task-back" type="button">← Indietro</button><h1>${title}</h1></div>`;
          const grid = document.createElement('div');
          grid.className = 'office-grid';
          if (cards.length) cards.forEach(card => grid.appendChild(card.cloneNode(true)));
          else grid.innerHTML = '<div class="office-task-empty">Nessuna lavorazione presente.</div>';
          content.appendChild(grid);
          screen.appendChild(content);
          document.body.appendChild(screen);
          document.body.classList.add('office-task-open');
          screen.querySelector('.office-task-back').addEventListener('click', () => {
            screen.remove();
            document.body.classList.remove('office-task-open');
          });
        }

        function realPainterCards(painter) {
          const selector = '.office-section.delivered .office-card, .office-section.to-collect .office-card';
          return [...document.querySelectorAll(selector)].filter(card =>
            String(card.dataset.search || card.textContent || '').toUpperCase().includes(painter)
          );
        }

        function syncPainterSummary() {
          document.querySelectorAll('.office-painters > div').forEach(row => {
            const painter = row.querySelector('span')?.textContent?.trim().toUpperCase();
            const counter = row.querySelector('strong');
            if (painter && counter) counter.textContent = String(realPainterCards(painter).length);
          });
        }

        document.addEventListener('click', (event) => {
          const kpi = event.target.closest('.office-kpis > div');
          if (kpi) {
            const cards = [...document.querySelectorAll('.office-kpis > div')];
            const index = cards.indexOf(kpi);
            const config = categoryConfig[index];
            if (!config) return;
            const sectionCards = [...document.querySelectorAll(`${config.selector} .office-card`)];
            openScreen(config.title, sectionCards);
            return;
          }

          const painterRow = event.target.closest('.office-painters > div');
          if (painterRow) {
            const painter = painterRow.querySelector('span')?.textContent?.trim().toUpperCase();
            if (!painter) return;
            openScreen(painter, realPainterCards(painter));
          }
        });

        function prepareClickableItems() {
          document.querySelectorAll('.office-kpis > div, .office-painters > div').forEach(item => {
            item.setAttribute('role', 'button');
            item.setAttribute('tabindex', '0');
          });
          syncPainterSummary();
        }

        document.addEventListener('keydown', (event) => {
          if (!['Enter', ' '].includes(event.key)) return;
          const item = event.target.closest?.('.office-kpis > div, .office-painters > div');
          if (!item) return;
          event.preventDefault();
          item.click();
        });

        new MutationObserver(prepareClickableItems).observe(document.getElementById('root'), { childList: true, subtree: true });
        prepareClickableItems();
      })();
    </script>
  </body>
</html>
